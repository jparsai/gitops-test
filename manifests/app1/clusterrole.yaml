apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: test-gitops-cr
  labels:
    app.kubernetes.io/name: gitops-test
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "list", "watch"]
